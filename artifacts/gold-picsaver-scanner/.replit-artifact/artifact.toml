kind = "mobile"
previewPath = "/gold-picsaver-scanner/"
title = "GOLD PICSAVER Loan Scanner"
description = "An offline-first mobile app for loan officers to photograph GOLD PICSAVER applications, review AI-extracted fields, and manage applicant records from one focused workspace."
version = "1.0.0"
id = "artifacts/gold-picsaver-scanner"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/gold-picsaver-scanner/" ]
localPort = 23660

[services.development]
run = "pnpm --filter @workspace/gold-picsaver-scanner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gold-picsaver-scanner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gold-picsaver-scanner", "run", "serve" ]

[services.env]
PORT = "23660"
BASE_PATH = "/gold-picsaver-scanner/"
